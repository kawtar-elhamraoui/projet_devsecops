        HTML_EOF
                
        # Remplacer les variables dans le dashboard
        sed -i "s/CRITICAL_COUNT/$CRITICAL/g" zap-reports/zap-dashboard.html
        sed -i "s/HIGH_COUNT/$HIGH/g" zap-reports/zap-dashboard.html
        sed -i "s/MEDIUM_COUNT/$MEDIUM/g" zap-reports/zap-dashboard.html
        sed -i "s/LOW_COUNT/$LOW/g" zap-reports/zap-dashboard.html
        sed -i "s/INFO_COUNT/$INFO/g" zap-reports/zap-dashboard.html
        sed -i "s/TOTAL_COUNT/$TOTAL_ALERTS/g" zap-reports/zap-dashboard.html
        
        # 8. Arrêter ZAP
