        }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>🔒 OWASP ZAP Security Dashboard</h1>
                    <div class="subtitle">Dynamic Application Security Testing Report</div>
                    <div class="subtitle">Generated: $(date +"%Y-%m-%d %H:%M:%S")</div>
        </div>
        
        <div class="dashboard">
            <div class="stats-grid">
                <div class="stat-card critical">
                    <div class="stat-label">Critical</div>
                    <div class="stat-value">CRITICAL_COUNT</div>
