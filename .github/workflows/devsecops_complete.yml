name: DevSecOps Pipeline Corrigé

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install API dependencies
      run: |
        cd micro_app
        pip install -r requirements.txt
        pip install pytest bandit safety
        
    - name: Run unit tests
      run: |
        cd micro_app
        python -m pytest tests/ -v || true
        
    - name: SAST - SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
      run: |
        echo "🔍 Démarrage analyse SonarCloud..."
        
        # Télécharger SonarScanner
        curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
        unzip -q sonar-scanner.zip
        
        # Analyser avec configuration corrigée
        ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
          -Dsonar.projectKey=kawtar-elhamraoui_projet_devsecops \
          -Dsonar.organization=kawtar-elhamraoui \
          -Dsonar.sources=micro_app/src \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.python.version=3.11 \
          -Dsonar.qualitygate.wait=false \
          -Dsonar.scm.disabled=true \
          -Dsonar.analysis.automatic=false
        
        echo "✅ Analyse SonarCloud terminée"
      
    - name: SAST - Bandit Security Scan
      run: |
        cd micro_app
        bandit -r src/ -f json -o ../bandit-report.json || true
        echo "📊 Résultats Bandit :"
        if [ -f ../bandit-report.json ]; then
          cat ../bandit-report.json | python -m json.tool | head -30
        else
          echo "Aucun rapport Bandit généré"
        fi
        
    - name: SCA - Check Python dependencies
      run: |
        cd micro_app
        safety check -r requirements.txt --json > ../safety-report.json || true
        echo "📦 Sécurité des dépendances :"
        if [ -f ../safety-report.json ]; then
          cat ../safety-report.json | python -m json.tool | head -30
        else
          echo "Aucun rapport Safety généré"
        fi
        
    - name: Build Docker image
      run: |
        cd micro_app
        docker build -t micro-app:latest . || true
        
    - name: Container Security - Trivy Scan
      if: success() || failure()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'micro-app:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Test API Locally
      run: |
        cd micro_app
        # Démarrer l'API en arrière-plan
        docker-compose up -d
        sleep 10
        
        # Tester les endpoints
        echo "🧪 Test des endpoints API..."
        curl -f http://localhost:8000/ || (echo "❌ API non accessible" && exit 1)
        curl -f http://localhost:8000/items || (echo "❌ Endpoint /items échoué" && exit 1)
        
        echo "✅ API testée avec succès"
        
    - name: DAST - OWASP ZAP Security Scan
      if: success() || failure()
      run: |
        echo "🛡️ Démarrage du scan DAST avec OWASP ZAP..."
        
        # Télécharger l'image ZAP officielle
        docker pull ghcr.io/zaproxy/zaproxy:stable
        
        # Créer le dossier pour les rapports
        mkdir -p zap-reports
        
        # Exécuter le scan baseline
        echo "🔍 Exécution du scan de sécurité..."
        
        docker run --rm \
          -v $(pwd)/zap-reports:/zap/wrk:rw \
          -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8000 \
          -r zap-dast-report.html \
          -w zap-dast-report.md \
          -J zap-dast-report.json \
          -a \
          -x zap-dast-report.xml || true
        
        echo "✅ Scan DAST terminé"
        
    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          trivy-results.sarif
          zap-reports/
        retention-days: 7
        
    - name: Cleanup
      if: always()
      run: |
        cd micro_app
        docker-compose down || true
        docker system prune -f || true
        echo "🧹 Nettoyage terminé"