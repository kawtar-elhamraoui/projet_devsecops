name: DevSecOps Pipeline Final

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    env:
      API_URL: "http://localhost:8000"
      ZAP_PORT: 8090

    steps:
    # =========================
    # 1. Checkout
    # =========================
    - name: Checkout source code
      uses: actions/checkout@v4

    # =========================
    # 2. Setup Python
    # =========================
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # =========================
    # 3. Install dependencies
    # =========================
    - name: Install API dependencies
      run: |
        cd micro_app
        pip install -r requirements.txt
        pip install pytest bandit safety
    # =========================
    # 4. Unit Tests
    # =========================
    - name: Run unit tests
      run: |
        cd micro_app
        python -m pytest tests/ -v || echo "Tests échoués mais pipeline continue"
    # =========================
    # 5. SAST - SonarCloud (SAFE MODE)
    # =========================
    - name: SAST - SonarCloud
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "SonarCloud non configuré"
          echo '{"status":"skipped"}' > sonarcloud-status.json
          exit 0
        fi
        curl -s \
          -H "Authorization: Bearer $SONAR_TOKEN" \
          "https://sonarcloud.io/api/qualitygates/project_status?projectKey=kawtar-elhamraoui_projet_devsecops" \
          -o sonarcloud-status.json || echo "{}" > sonarcloud-status.json
    # =========================
    # 6. SAST - Bandit
    # =========================
    - name: SAST - Bandit
      run: |
        cd micro_app
        bandit -r src -f json -o ../bandit-report.json || true
    # =========================
    # 7. SCA - Safety
    # =========================
    - name: SCA - Safety
      run: |
        cd micro_app
        safety check -r requirements.txt --output text > ../safety-report.txt || true
    # =========================
    # 8. Build Docker Image
    # =========================
    - name: Build Docker image
      run: |
        cd micro_app
        docker build -t micro-app:latest .
    # =========================
    # 9. Container Scan - Trivy
    # =========================
    - name: Container Scan - Trivy
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: micro-app:latest
        format: sarif
        output: trivy-report.sarif
        severity: CRITICAL,HIGH

    # =========================
    # 10. Start Application
    # =========================
    - name: Start application
      run: |
        docker run -d --name micro-app-api -p 8000:8000 micro-app:latest
        sleep 15
        curl -f http://localhost:8000 || echo "API non accessible"
        
    # =========================
    # 11. DAST - OWASP ZAP (Version améliorée)
    # =========================
    - name: DAST - OWASP ZAP
      continue-on-error: true
      run: |
        echo "🔍 Démarrage du scan DAST avec OWASP ZAP..."
        
        # Créer les dossiers de rapports
        mkdir -p zap-reports
        
        # 1. Démarrer ZAP en mode daemon
        echo "1. Démarrage de OWASP ZAP..."
        docker run --rm -d \
          -p $ZAP_PORT:$ZAP_PORT \
          --name zap \
          owasp/zap2docker-stable zap.sh \
          -daemon -host 0.0.0.0 -port $ZAP_PORT \
          -config api.disablekey=true \
          -config api.addrs.addr.name=.* \
          -config api.addrs.addr.regex=true
        
        echo "Attente du démarrage de ZAP..."
        sleep 20
        
        # 2. Vérifier que l'API est accessible
        echo "2. Vérification de l'API à $API_URL..."
        if ! curl -s $API_URL > /dev/null; then
          echo "⚠️ L'API n'est pas accessible. Redémarrage..."
          docker stop micro-app-api || true
          docker run -d --name micro-app-api -p 8000:8000 micro-app:latest
          sleep 10
        fi
        
        # 3. Spider l'API pour découvrir les endpoints
        echo "3. Découverte des endpoints avec Spider..."
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT \
          spider $API_URL
        
        sleep 5
        
        # 4. Scan actif
        echo "4. Scan de sécurité actif..."
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT \
          active-scan --scanners all --recursive $API_URL
        
        sleep 5
        
        # 5. Générer les rapports
        echo "5. Génération des rapports..."
        
        # Rapport HTML complet
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT \
          report -o /zap/wrk/zap-report.html -f html
        
        # Rapport JSON pour analyse
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT \
          report -o /zap/wrk/zap-report.json -f json
        
        # Rapport Markdown pour GitHub
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT \
          report -o /zap/wrk/zap-report.md -f md
        
        # 6. Copier les rapports
        docker cp zap:/zap/wrk/zap-report.html zap-reports/
        docker cp zap:/zap/wrk/zap-report.json zap-reports/
        docker cp zap:/zap/wrk/zap-report.md zap-reports/
        
        # 7. Créer un résumé statistique
        echo "6. Création du résumé statistique..."
        
        # Extraire les statistiques du rapport JSON
        if [ -f zap-reports/zap-report.json ]; then
          TOTAL_ALERTS=$(jq '.site[]?.alerts[]? | length' zap-reports/zap-report.json 2>/dev/null | wc -l || echo 0)
          CRITICAL=$(grep -c '"risk":"Critical"' zap-reports/zap-report.json 2>/dev/null || echo 0)
          HIGH=$(grep -c '"risk":"High"' zap-reports/zap-report.json 2>/dev/null || echo 0)
          MEDIUM=$(grep -c '"risk":"Medium"' zap-reports/zap-report.json 2>/dev/null || echo 0)
          LOW=$(grep -c '"risk":"Low"' zap-reports/zap-report.json 2>/dev/null || echo 0)
          INFO=$(grep -c '"risk":"Informational"' zap-reports/zap-report.json 2>/dev/null || echo 0)
        else
          TOTAL_ALERTS=0
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          INFO=0
        fi
        
        # Générer un dashboard HTML pour ZAP
        cat > zap-reports/zap-dashboard.html << 'HTML_EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
