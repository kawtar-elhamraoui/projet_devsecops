name: DevSecOps Pipeline Final

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    env:
      API_URL: "http://localhost:8000"
      ZAP_PORT: 8090

    steps:
    # =========================
    # 1. Checkout
    # =========================
    - name: Checkout source code
      uses: actions/checkout@v4

    # =========================
    # 2. Setup Python
    # =========================
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # =========================
    # 3. Install dependencies
    # =========================
    - name: Install API dependencies
      run: |
        cd micro_app
        pip install -r requirements.txt
        pip install pytest bandit safety jq

    # =========================
    # 4. Unit Tests
    # =========================
    - name: Run unit tests
      run: |
        cd micro_app
        python -m pytest tests/ -v || echo "Tests échoués mais pipeline continue"

    # =========================
    # 5. SAST - SonarCloud (SAFE MODE)
    # =========================
    - name: SAST - SonarCloud
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "SonarCloud non configuré"
          echo '{"status":"skipped"}' > sonarcloud-status.json
          exit 0
        fi

        curl -s \
          -H "Authorization: Bearer $SONAR_TOKEN" \
          "https://sonarcloud.io/api/qualitygates/project_status?projectKey=kawtar-elhamraoui_projet_devsecops" \
          -o sonarcloud-status.json || echo "{}" > sonarcloud-status.json

    # =========================
    # 6. SAST - Bandit
    # =========================
    - name: SAST - Bandit
      run: |
        cd micro_app
        bandit -r src -f json -o ../bandit-report.json || true

    # =========================
    # 7. SCA - Safety
    # =========================
    - name: SCA - Safety
      run: |
        cd micro_app
        safety check -r requirements.txt --output text > ../safety-report.txt || true

    # =========================
    # 8. Build Docker Image
    # =========================
    - name: Build Docker image
      run: |
        cd micro_app
        docker build -t micro-app:latest .

    # =========================
    # 9. Container Scan - Trivy
    # =========================
    - name: Container Scan - Trivy
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: micro-app:latest
        format: sarif
        output: trivy-report.sarif
        severity: CRITICAL,HIGH

    # =========================
    # 10. Start Application
    # =========================
    - name: Start application
      run: |
        docker run -d --name micro-app-api -p 8000:8000 micro-app:latest
        sleep 15
        curl -f http://localhost:8000 || echo "API non accessible"

    # =========================
    # 11. DAST - OWASP ZAP
    # =========================
    - name: DAST - OWASP ZAP
      continue-on-error: true
      run: |
        mkdir -p zap-reports

        docker run --rm -d \
          -p $ZAP_PORT:$ZAP_PORT \
          --name zap \
          owasp/zap2docker-stable zap.sh \
          -daemon -host 0.0.0.0 -port $ZAP_PORT \
          -config api.disablekey=true

        sleep 20

        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT spider $API_URL
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT active-scan $API_URL

        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT report -o /zap/wrk/zap-report.html -f html
        docker exec zap zap-cli --zap-url http://localhost:$ZAP_PORT report -o /zap/wrk/zap-report.json -f json

        docker cp zap:/zap/wrk/zap-report.html zap-reports/
        docker cp zap:/zap/wrk/zap-report.json zap-reports/

    # =========================
    # 12. Generate Security Dashboard
    # =========================
    - name: Generate Security Dashboard
      if: always()
      run: |
        BANDIT=$(jq '.results | length' bandit-report.json 2>/dev/null || echo 0)
        SAFETY=$(wc -l < safety-report.txt 2>/dev/null || echo 0)
        ZAP_CRITICAL=$(grep -c '"risk":"Critical"' zap-reports/zap-report.json 2>/dev/null || echo 0)

        cat > security-dashboard.md <<EOF
        # 🔒 Security Dashboard

        **Bandit issues:** $BANDIT  
        **Safety issues:** $SAFETY  
        **ZAP Critical:** $ZAP_CRITICAL
        EOF

    # =========================
    # 13. Upload Artifacts
    # =========================
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.txt
          trivy-report.sarif
          zap-reports/**
          security-dashboard.md
          sonarcloud-status.json

    # =========================
    # 14. Security Gate
    # =========================
    - name: Security Gate
      if: always()
      run: |
        ZAP_CRITICAL=$(grep -c '"risk":"Critical"' zap-reports/zap-report.json 2>/dev/null || echo 0)

        if [ "$ZAP_CRITICAL" -gt 0 ]; then
          echo "❌ Pipeline bloqué : vulnérabilités critiques détectées"
          exit 1
        fi

        echo "✅ Security gate passed"

    # =========================
    # 15. Cleanup
    # =========================
    - name: Cleanup
      if: always()
      run: |
        docker stop micro-app-api zap || true
        docker rm micro-app-api zap || true
        docker system prune -f
