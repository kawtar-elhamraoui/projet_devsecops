   # =========================
# 12. Generate Security Dashboard (CORRIGÉ)
# =========================
- name: Generate Security Dashboard
  if: always()
  run: |
    echo "📊 Génération du tableau de bord de sécurité..."
    
    # Lire les statistiques de chaque outil
    BANDIT_ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo 0)
    SAFETY_ISSUES=$(wc -l < safety-report.txt 2>/dev/null | awk '{print $1}' || echo 0)
    
    # Essayer d'extraire les données ZAP
    ZAP_CRITICAL=$(grep -c '"risk":"Critical"' zap-reports/zap-report.json 2>/dev/null || echo 0)
    ZAP_HIGH=$(grep -c '"risk":"High"' zap-reports/zap-report.json 2>/dev/null || echo 0)
    ZAP_MEDIUM=$(grep -c '"risk":"Medium"' zap-reports/zap-report.json 2>/dev/null || echo 0)
    ZAP_LOW=$(grep -c '"risk":"Low"' zap-reports/zap-report.json 2>/dev/null || echo 0)
    ZAP_TOTAL=$((ZAP_CRITICAL + ZAP_HIGH + ZAP_MEDIUM + ZAP_LOW))
    
    # Lire le statut SonarCloud
    SONAR_STATUS=$(jq -r '.projectStatus.status // "none"' sonarcloud-status.json 2>/dev/null || echo "unknown")
    
    # Générer le tableau de bord markdown CORRIGÉ
    cat > security-dashboard.md << 'EOF'
# 🔒 Security Dashboard - DevSecOps Pipeline

  **Date:** $(date +"%Y-%m-%d %H:%M:%S")  
  **Pipeline:** ${{ github.workflow }}  
  **Commit:** ${{ github.sha }}

## 📈 Security Metrics

### SAST - Static Analysis
| Tool | Issues | Status |
|------|--------|--------|
| Bandit | $BANDIT_ISSUES issues | $(if [ $BANDIT_ISSUES -eq 0 ]; then echo "✅"; else echo "⚠️"; fi) |
| SonarCloud | $SONAR_STATUS | $(if [ "$SONAR_STATUS" = "OK" ]; then echo "✅"; else echo "⚠️"; fi) |

### DAST - Dynamic Analysis (OWASP ZAP)
| Severity | Count |
|----------|-------|
| 🔴 Critical | $ZAP_CRITICAL |
| 🟠 High | $ZAP_HIGH |
| 🟡 Medium | $ZAP_MEDIUM |
| 🟢 Low | $ZAP_LOW |
| **Total** | **$ZAP_TOTAL** |

### SCA - Software Composition Analysis
| Tool | Issues |
|------|--------|
| Safety | $SAFETY_ISSUES vulnerabilities |

### Container Security
| Tool | Scan Result |
|------|-------------|
| Trivy | $(if [ -f "trivy-report.sarif" ]; then echo "✅ Completed"; else echo "⚠️ Failed"; fi) |

## 🎯 Security Gates

- [ ] **Critical vulnerabilities:** $(if [ $ZAP_CRITICAL -eq 0 ]; then echo "✅ None"; else echo "❌ $ZAP_CRITICAL found"; fi)
- [ ] **High vulnerabilities:** $(if [ $ZAP_HIGH -eq 0 ]; then echo "✅ None"; else echo "⚠️ $ZAP_HIGH found"; fi)
- [ ] **SAST issues:** $(if [ $BANDIT_ISSUES -eq 0 ]; then echo "✅ None"; else echo "⚠️ $BANDIT_ISSUES found"; fi)
- [ ] **Dependency vulnerabilities:** $(if [ $SAFETY_ISSUES -eq 0 ]; then echo "✅ None"; else echo "⚠️ $SAFETY_ISSUES found"; fi)

## 📁 Available Reports

1. **DAST Reports:** [zap-dashboard.html](zap-reports/zap-dashboard.html) | [zap-report.html](zap-reports/zap-report.html)
2. **SAST Reports:** [bandit-report.json](bandit-report.json)
3. **SCA Reports:** [safety-report.txt](safety-report.txt)
4. **Container Scan:** [trivy-report.sarif](trivy-report.sarif)
5. **SonarCloud:** [sonarcloud-status.json](sonarcloud-status.json)

## 🚨 Recommendations

$(if [ $ZAP_CRITICAL -gt 0 ]; then echo "1. **CRITICAL:** Fix $ZAP_CRITICAL critical vulnerabilities IMMEDIATELY"; fi)
$(if [ $ZAP_HIGH -gt 0 ]; then echo "2. **HIGH:** Address $ZAP_HIGH high severity issues in next sprint"; fi)
$(if [ $BANDIT_ISSUES -gt 0 ]; then echo "3. **SAST:** Review $BANDIT_ISSUES Bandit findings"; fi)
$(if [ $SAFETY_ISSUES -gt 0 ]; then echo "4. **SCA:** Update $SAFETY_ISSUES vulnerable dependencies"; fi)
$(if [ $ZAP_CRITICAL -eq 0 ] && [ $ZAP_HIGH -eq 0 ] && [ $BANDIT_ISSUES -eq 0 ] && [ $SAFETY_ISSUES -eq 0 ]; then echo "✅ All security checks passed!"; fi)

---

*Generated automatically by DevSecOps Pipeline - $(date)*
EOF
    
    # Exécuter les commandes bash à l'intérieur du here-doc
    # Pour que les $(if...) soient évalués
    mv security-dashboard.md security-dashboard.tmp
    
    # Évaluer les commandes bash
    eval "cat << 'EOF'
$(cat security-dashboard.tmp)
EOF" > security-dashboard.md
    
    rm security-dashboard.tmp
    
    echo "✅ Dashboard généré: security-dashboard.md"
        
    # =========================
    # 13. Upload Artifacts
    # =========================
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.txt
          trivy-report.sarif
          zap-reports/**
          security-dashboard.md
          sonarcloud-status.json
        retention-days: 30

    # =========================
    # 14. Security Gate Check
    # =========================
    - name: Security Gate
      if: always()
      run: |
        echo "🔒 Vérification des seuils de sécurité..."
        
        # Charger les données ZAP
        ZAP_CRITICAL=$(grep -c '"risk":"Critical"' zap-reports/zap-report.json 2>/dev/null || echo 0)
        ZAP_HIGH=$(grep -c '"risk":"High"' zap-reports/zap-report.json 2>/dev/null || echo 0)
        
        # Seuils de sécurité
        MAX_CRITICAL=0
        MAX_HIGH=3
        
        echo "Critical vulnerabilities: $ZAP_CRITICAL (max allowed: $MAX_CRITICAL)"
        echo "High vulnerabilities: $ZAP_HIGH (max allowed: $MAX_HIGH)"
        
        # Vérifier les seuils
        if [ $ZAP_CRITICAL -gt $MAX_CRITICAL ]; then
          echo "❌ BLOCKED: $ZAP_CRITICAL critical vulnerabilities found (max: $MAX_CRITICAL)"
          exit 1
        fi
        
        if [ $ZAP_HIGH -gt $MAX_HIGH ]; then
          echo "❌ BLOCKED: $ZAP_HIGH high vulnerabilities found (max: $MAX_HIGH)"
          exit 1
        fi
        
        echo "✅ Security gates passed successfully!"
        
    # =========================
    # 15. Cleanup
    # =========================
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Nettoyage des conteneurs..."
        docker stop micro-app-api 2>/dev/null || true
        docker rm micro-app-api 2>/dev/null || true
        docker stop zap 2>/dev/null || true
        docker rm zap 2>/dev/null || true
        docker system prune -f 2>/dev/null || true
        echo "✅ Nettoyage terminé"