name: DevSecOps Pipeline Complet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========== ÉTAPE 1 : SAST + SCA ==========
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: SAST - SonarQube Scan
      if: ${{ github.event_name == 'push' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        # Installation SonarScanner
        curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
        unzip -q sonar-scanner.zip
        ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
          -Dsonar.projectKey=votre_projet_devsecops \
          -Dsonar.sources=micro_app/src \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN
      
    - name: SAST - Bandit (Python spécifique)
      run: |
        cd micro_app
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json
        
    - name: SCA - OWASP Dependency Check
      run: |
        # Télécharger et exécuter Dependency-Check
        curl -sSLo dependency-check.zip https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.10/dependency-check-9.0.10-release.zip
        unzip -q dependency-check.zip
        ./dependency-check/bin/dependency-check.sh \
          --project "projet_devsecops" \
          --scan "micro_app" \
          --format "HTML" \
          --out "dependency-check-report.html"
          
  # ========== ÉTAPE 2 : BUILD & SCAN CONTENEUR ==========
  container-security:
    runs-on: ubuntu-latest
    needs: static-analysis
    
    steps:
    - name: Build Docker image
      run: |
        cd micro_app
        docker build -t micro-app:latest .
        
    - name: SCA Container - Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'micro-app:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
  # ========== ÉTAPE 3 : DAST ==========
  dynamic-testing:
    runs-on: ubuntu-latest
    needs: container-security
    
    steps:
    - name: Deploy app temporarily
      run: |
        cd micro_app
        docker-compose up -d
        sleep 10  # Attendre que l'API démarre
        
    - name: DAST - OWASP ZAP Scan
      run: |
        # Lancer ZAP en mode baseline
        docker run -v $(pwd):/zap/wrk -t owasp/zap2docker-stable \
          zap-baseline.py \
          -t http://host.docker.internal:8000 \
          -g gen.conf \
          -r zap-report.html
          
    - name: Upload all reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports-complete
        path: |
          bandit-report.json
          dependency-check-report.html
          trivy-results.sarif
          zap-report.html